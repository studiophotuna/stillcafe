{% load static wfm %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Workforce Management</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600&display=swap">
  <link rel="stylesheet" href="{% static 'core/industry.css' %}">
  <link rel="stylesheet" href="{% static 'core/workload.css' %}">
  <link rel="stylesheet" href="{% static 'core/theme.css' %}">
  <link rel="stylesheet" href="{% static 'core/py.css' %}">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <form method="post" class="blueprint dialog solid" style="width:min(420px,100%);padding:28px;gap:14px">{% corners %}
    {% csrf_token %}
    <img src="{% static 'core/dsv-logo.png' %}" alt="DSV" style="height:28px;width:auto;align-self:flex-start">
    <div class="dialog-title" style="font-size:28px">Workforce Management</div>
    <span class="small">Sign in with your work email.</span>
    {% if form.errors %}<span style="color:var(--color-accent-800);font-size:14px">Wrong email or password.</span>{% endif %}
    <div class="field"><label for="id_username">Work email</label><input id="id_username" name="username" type="email" class="input" autocomplete="username" required autofocus></div>
    <div class="field"><label for="id_password">Password</label><input id="id_password" name="password" type="password" class="input" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="blueprint btn btn-primary btn-lg">{% corners %}Sign in</button>
  </form>
</main>
</body>
</html>
